services:
  - type: web
    name: tucson-barber-api
    env: node
    region: ohio
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:server
    healthCheckPath: /api/auth/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: tucson-barber-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: tucson-barber-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: tucson-barber-web
    env: node
    region: ohio
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: tucson-barber-db
    region: ohio
    plan: free
    databaseName: barberadmin
    ipAllowList: []
